services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Mainfreme\UserProfile\:
        resource: '../../'
        exclude:
            - '../../DependencyInjection/'
            - '../../UserProfileBundle.php'
            - '../../Infrastructure/OpenApi/'
            - '../../Domain/User/Model/RoleTree.php'

    Mainfreme\UserProfile\Infrastructure\Http\Controller\UserProfileRestController:
        tags: ['controller.service_arguments']

    Mainfreme\UserProfile\Application\Service\MessageBusDispatcher:
        arguments:
            $commandBus: '@user_profile.command.bus'
            $queryBus: '@user_profile.query.bus'

    user_profile.command.bus:
        class: Symfony\Component\Messenger\MessageBus
        arguments:
            - !tagged_iterator messenger.bus.user_profile.command.bus.middleware

    user_profile.query.bus:
        class: Symfony\Component\Messenger\MessageBus
        arguments:
            - !tagged_iterator messenger.bus.user_profile.query.bus.middleware

    messenger.middleware.handle_message.user_profile.command:
        class: Symfony\Component\Messenger\Middleware\HandleMessageMiddleware
        arguments:
            - '@user_profile.command.handler_locator'
        tags:
            - { name: messenger.bus.user_profile.command.bus.middleware, priority: 0 }

    messenger.middleware.handle_message.user_profile.query:
        class: Symfony\Component\Messenger\Middleware\HandleMessageMiddleware
        arguments:
            - '@user_profile.query.handler_locator'
        tags:
            - { name: messenger.bus.user_profile.query.bus.middleware, priority: 0 }

    user_profile.command.handler_locator:
        class: Symfony\Component\Messenger\Handler\HandlersLocator
        arguments:
            -
                'Mainfreme\UserProfile\Application\Command\CreateUser\CreateUserCommand':
                    - '@Mainfreme\UserProfile\Application\Command\CreateUser\CreateUserHandler'
                'Mainfreme\UserProfile\Application\Command\UpdateProfile\UpdateProfileCommand':
                    - '@Mainfreme\UserProfile\Application\Command\UpdateProfile\UpdateProfileHandler'
                'Mainfreme\UserProfile\Application\Command\AssignRole\AssignRoleCommand':
                    - '@Mainfreme\UserProfile\Application\Command\AssignRole\AssignRoleHandler'
                'Mainfreme\UserProfile\Application\Command\CreateRole\CreateRoleCommand':
                    - '@Mainfreme\UserProfile\Application\Command\CreateRole\CreateRoleHandler'
                'Mainfreme\UserProfile\Application\Command\CreateGroup\CreateGroupCommand':
                    - '@Mainfreme\UserProfile\Application\Command\CreateGroup\CreateGroupHandler'

    user_profile.query.handler_locator:
        class: Symfony\Component\Messenger\Handler\HandlersLocator
        arguments:
            -
                'Mainfreme\UserProfile\Application\Query\GetUser\GetUserQuery':
                    - '@Mainfreme\UserProfile\Application\Query\GetUser\GetUserHandler'
                'Mainfreme\UserProfile\Application\Query\ListUsers\ListUsersQuery':
                    - '@Mainfreme\UserProfile\Application\Query\ListUsers\ListUsersHandler'
                'Mainfreme\UserProfile\Application\Query\GetRoleTree\GetRoleTreeQuery':
                    - '@Mainfreme\UserProfile\Application\Query\GetRoleTree\GetRoleTreeHandler'
                'Mainfreme\UserProfile\Application\Query\ListGroups\ListGroupsQuery':
                    - '@Mainfreme\UserProfile\Application\Query\ListGroups\ListGroupsHandler'

    Mainfreme\UserProfile\Infrastructure\Persistence\FilesystemUserRepository:
        arguments:
            $rootDirectory: '%user_profile.storage.filesystem.root%'

    Mainfreme\UserProfile\Infrastructure\Persistence\FilesystemRoleCatalog:
        arguments:
            $rootDirectory: '%user_profile.storage.filesystem.root%'
            $seedConfig: '%user_profile.role_tree%'

    Mainfreme\UserProfile\Infrastructure\Persistence\InMemoryRoleCatalog:
        arguments:
            $seed: '%user_profile.role_tree%'

    Mainfreme\UserProfile\Infrastructure\Persistence\FilesystemGroupRepository:
        arguments:
            $rootDirectory: '%user_profile.storage.filesystem.root%/groups'
